# Project metadata and tool config. flight-monitor runs as plain scripts from a
# checkout (data/ and .env live next to them), so there is no build backend:
# install with `pip install -r requirements.txt` (+ requirements-dev.txt).
[project]
name = "flight-monitor"
version = "0.1.0"
description = "Round-trip flight price monitor with selectable price engines, email reports and a PySide6 GUI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PTH"]
ignore = ["B008", "B009", "B010"]

[tool.mypy]
python_version = "3.10"
files = ["engines.py", "flight_monitor.py"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
