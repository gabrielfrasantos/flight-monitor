name: Build Installers

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to attach the installer to (e.g. v0.2.0); empty = build only
        required: false
        type: string
        default: ""
  pull_request:
    paths:
      - "**.py"
      - requirements.txt
      - flight-monitor.spec
      - installer/**
      - .github/workflows/build-installers.yml

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag_name }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Generate icon files
        run: python scripts/generate_icon.py

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm flight-monitor.spec

      - name: Smoke-test the built app
        shell: pwsh
        env:
          FLIGHT_MONITOR_HOME: ${{ runner.temp }}\fm-built
        run: |
          $p = Start-Process dist\flight-monitor\flight-monitor.exe -ArgumentList "--smoke-test" -Wait -PassThru
          Get-Content "$env:FLIGHT_MONITOR_HOME\data\monitor.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "smoke test failed (exit $($p.ExitCode))" }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ver = if ($env:TAG) { $env:TAG.TrimStart("v") } else {
            python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          }
          iscc installer/windows/setup.iss /DAppVersion=$ver
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          "INSTALLER=installer-output\flight-monitor-$ver-windows-setup.exe" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install silently and smoke-test the installed app
        shell: pwsh
        env:
          FLIGHT_MONITOR_HOME: ${{ runner.temp }}\fm-installed
        run: |
          $dir = "$env:RUNNER_TEMP\Flight Monitor"
          $setup = Start-Process $env:INSTALLER -Wait -PassThru -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/TASKS=""""", "/DIR=""$dir"""
          if ($setup.ExitCode -ne 0) { throw "installer failed (exit $($setup.ExitCode))" }
          $p = Start-Process "$dir\flight-monitor.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          Get-Content "$env:FLIGHT_MONITOR_HOME\data\monitor.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "installed app smoke test failed (exit $($p.ExitCode))" }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flight-monitor-windows-installer
          path: ${{ env.INSTALLER }}
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: env.TAG != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.INSTALLER }}
